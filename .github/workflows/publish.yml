name: publish


on:
  push:
    branches: ["aarch64"]


jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Build aarch64
        run: sudo docker build . -t lazypanda07/ubuntu_cxx20:aarch64
          
      - name: Push aarch64
        run: |
            sudo docker login -u "${{ secrets.DOCKER_HUB_LOGIN }}" -p "${{ secrets.DOCKER_HUB_PASSWORD }}"
            sudo docker push lazypanda07/ubuntu_cxx20:aarch64
          