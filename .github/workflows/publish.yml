name: publish


on:
  push:
    branches: ["24.04"]


permissions:
  packages: write


jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Build and push 24.04 to DockerHub
        run: |
            sudo docker build . -t lazypanda07/ubuntu_cxx20:24.04
            sudo docker login -u "${{ secrets.DOCKER_HUB_LOGIN }}" -p "${{ secrets.DOCKER_HUB_PASSWORD }}"
            sudo docker push lazypanda07/ubuntu_cxx20:24.04
          
      - name: Build and push 24.04 to ghcr
        run: |
            sudo docker build . -t ghcr.io/lazypanda07/ubuntu_cxx20:24.04
            echo ${{ secrets.GITHUB_TOKEN }} | sudo docker login ghcr.io -u LazyPanda07 --password-stdin
            sudo docker push ghcr.io/lazypanda07/ubuntu_cxx20:24.04
